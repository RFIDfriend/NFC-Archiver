<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="PN5180 3.3V to 5V bridge">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111">Required: bridge PN5180 3.3V ” 5V</text>
  <rect x="180" y="60" width="360" height="160" rx="10" fill="#e9f8ef" stroke="#1f9d57" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#147a42">PN5180 module (power pins)</text>
  <rect x="250" y="120" width="70" height="36" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="400" y="120" width="70" height="36" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="285" y="143" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="12" fill="#111">3.3V</text>
  <text x="435" y="143" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="12" fill="#111">5V</text>
  <path d="M320 138 H400" stroke="#f0a000" stroke-width="6" stroke-linecap="round"/>
  <text x="360" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#b45309">solder bridge / jumper</text>
  <line x1="80" y1="138" x2="250" y2="138" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="80" cy="138" r="6" fill="#d32f2f"/>
  <text x="80" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d32f2f">from ESP32 3.3V</text>
  <text x="360" y="210" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Feed 3.3V to both pins  otherwise many boards never start.</text>
  <text x="360" y="255" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#666">Also connect GND ” GND. SPI/control stay at 3.3V logic.</text>
</svg>
